[tool.poetry]
name = "HTP-tools-cif2x"
version = "1.2.0"
description = "High-Throughput calculation tools"
authors = ["HTP-tools developers <htp-tools-dev@issp.u-tokyo.ac.jp>"]
license = "GPL-3.0-or-later"

readme = "README.md"
repository = "https://github.com/issp-center-dev/cif2x"

packages = [
  { include = "cif2x", from = "src" },
  { include = "getcif", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.11"
numpy = ">=1.20"
pandas = ">=1.4"
# mp_api needs pymatgen > 2024.2.20 and getcif/cif2x use the mp_api client;
# verified with pymatgen 2026.10.24
pymatgen = ">2024.2.20"
f90nml = "^1.4"
beautifulsoup4 = "^4"
mp_api = ">=0.40"
phonopy = "*"
"ruamel.yaml" = ">=0.17"

[tool.poetry.extras]

[tool.poetry.dev-dependencies]
pytest = "*"

[tool.poetry.scripts]
cif2x = "cif2x.main:main"
getcif = "getcif.main:main"
cif2x-pp-cutoff = "cif2x.pp_cutoff:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
# E402: the modules set up their logger before the imports; E501/E741: style;
# B905: zip(strict=) is noise for the 3-tuples zipped here
ignore = ["E402", "E501", "E741", "B905"]

[tool.ruff.lint.per-file-ignores]
# the AkaiKKR input tokenizer reads one token per statement on purpose
"src/cif2x/akaikkr/read_input.py" = ["E702"]
